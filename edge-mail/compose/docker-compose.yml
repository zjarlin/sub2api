# Edge Mail - 边缘计算邮件收发服务
#
# 设计：不单独对外暴露宿主端口。作为 sub2api 网关的内部上游，
# 通过 sub2api-gateway 的 /mail/ 路径统一对外，对外入口仍是 18080。
#
# 该服务加入 sub2api 的现有 Compose 网络（外部网络），因此先启动 sub2api 集群，
# 再启动本服务。
services:
  edge-mail:
    image: ${EDGE_MAIL_IMAGE:-zjarlin/edge-mail:latest}
    container_name: edge-mail
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    # 不映射宿主端口；仅在 sub2api 内部网络暴露 18084 供网关反代
    expose:
      - "18084"
    environment:
      PORT: "18084"
      WORKERS: "${EDGE_MAIL_WORKERS:-1}"
      MAIL_SEND_ENABLED: "${MAIL_SEND_ENABLED:-true}"
      MAIL_MAX_FETCH: "${MAIL_MAX_FETCH:-50}"
      MAIL_MAX_ATTACHMENT_BYTES: "${MAIL_MAX_ATTACHMENT_BYTES:-26214400}"
      MAIL_ALLOWED_PROVIDERS: "${MAIL_ALLOWED_PROVIDERS:-}"
      MAIL_CONNECT_TIMEOUT_SECONDS: "${MAIL_CONNECT_TIMEOUT_SECONDS:-20}"
      MAIL_OPERATION_TIMEOUT_SECONDS: "${MAIL_OPERATION_TIMEOUT_SECONDS:-60}"
      MAIL_ALLOW_EXTERNAL_RECIPIENTS: "${MAIL_ALLOW_EXTERNAL_RECIPIENTS:-true}"
      MAIL_DEFAULT_FROM_NAME: "${MAIL_DEFAULT_FROM_NAME:-}"
      TZ: "${TZ:-Asia/Shanghai}"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:18084/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    deploy:
      resources:
        limits:
          memory: ${EDGE_MAIL_MEMORY_LIMIT:-512m}
    networks:
      - sub2api-network

networks:
  sub2api-network:
    external: true
    name: ${SUB2API_NETWORK:-sub2api_sub2api-network}
