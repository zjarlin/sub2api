services:
  sub2api:
    image: ${SUB2API_IMAGE:?SUB2API_IMAGE is required}
    container_name: !reset null
    ports: !reset []

  gateway:
    image: nginx:1.27-alpine
    container_name: sub2api-gateway
    restart: unless-stopped
    depends_on:
      sub2api:
        condition: service_healthy
    ports:
      - "${CLUSTER_BIND_HOST:-0.0.0.0}:18080:80"
    # 挂载目录而不是单个文件：Docker 的文件 bind mount 绑定的是 inode，
    # 而部署脚本用 `git archive | tar -x` 同步代码会替换 nginx.conf 的 inode，
    # 导致运行中的网关永久停在旧配置（曾使 /mail/ 等新路由静默不生效）。
    # 目录挂载按路径跟踪，文件被替换后仍能读到新内容。
    volumes:
      - ./deploy/cluster:/etc/nginx/cluster:ro
    # 直接从挂载目录加载配置：目录挂载按路径解析，nginx.conf 被替换后
    # 新启动/重载的 nginx 一定读到最新内容，不再受 inode 变化影响。
    command: ["nginx", "-c", "/etc/nginx/cluster/nginx.conf", "-g", "daemon off;"]
    networks:
      - sub2api-network
    healthcheck:
      test: ["CMD", "wget", "-q", "-T", "5", "-O", "/dev/null", "http://127.0.0.1/health"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 10s
