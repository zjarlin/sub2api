events {}

http {
    resolver 127.0.0.11 valid=5s ipv6=off;

    client_max_body_size 256m;

    map $http_upgrade $connection_upgrade {
        default upgrade;
        '' close;
    }

    server {
        listen 80;
        server_name _;

        # 边缘计算视觉服务：内部上游 edge-vision:18081，对外统一走 18080。
        # 去掉 /vision 前缀后转发，因此 /vision/detect -> /detect。
        location /vision/ {
            set $edge_vision_backend http://edge-vision:18081;
            rewrite ^/vision/(.*)$ /$1 break;
            proxy_pass $edge_vision_backend;
            proxy_http_version 1.1;
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_buffering off;
            proxy_request_buffering off;
            proxy_read_timeout 300s;
            proxy_send_timeout 300s;
            proxy_next_upstream error timeout http_502 http_503 http_504;
        }

        location / {
            set $sub2api_backend http://sub2api:8080;
            proxy_pass $sub2api_backend;
            proxy_http_version 1.1;
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_buffering off;
            proxy_request_buffering off;
            proxy_read_timeout 24h;
            proxy_send_timeout 24h;
            proxy_next_upstream error timeout http_502 http_503 http_504;
        }
    }
}
