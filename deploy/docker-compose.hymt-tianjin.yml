services:
  hymt:
    image: ${HYMT_DCU_IMAGE:-hy-vllm:hymt-20261007}
    container_name: hymt-dcu
    restart: unless-stopped
    mem_limit: 12g
    cpus: 4
    pids_limit: 1024
    shm_size: 2g
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    devices:
      - /dev/kfd:/dev/kfd
      - /dev/mkfd:/dev/mkfd
      - /dev/dri:/dev/dri
    environment:
      - HIP_VISIBLE_DEVICES=${HYMT_DCU_DEVICE:-1}
      - CUDA_VISIBLE_DEVICES=${HYMT_DCU_DEVICE:-1}
      - VLLM_ATTENTION_BACKEND=TORCH_SDPA
      - HF_HUB_OFFLINE=1
      - TRANSFORMERS_OFFLINE=1
      - VLLM_API_KEY=${HYMT_DCU_API_KEY:?HYMT_DCU_API_KEY is required}
    volumes:
      - /usr/local/hyhal:/opt/hyhal:ro
      - ${HYMT_DCU_MODEL_DIR:-/opt/models/Hy-MT2-1.8B}:/model:ro
    ports:
      - "${HYMT_DCU_BIND_IP:-127.0.0.1}:${HYMT_DCU_PORT:-18086}:8000"
    entrypoint: ["python", "-m", "vllm.entrypoints.openai.api_server"]
    command:
      - --model
      - /model
      - --served-model-name
      - hy-mt2
      - --host
      - 0.0.0.0
      - --port
      - "8000"
      - --dtype
      - bfloat16
      - --max-model-len
      - "8192"
      - --gpu-memory-utilization
      - "0.12"
      - --max-num-seqs
      - "2"
      - --max-num-batched-tokens
      - "4096"
      - --enforce-eager
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8000/health"]
      interval: 15s
      timeout: 5s
      retries: 8
      start_period: 180s
  hymt-tunnel:
    image: ${HYMT_DCU_IMAGE:-hy-vllm:hymt-20261007}
    container_name: hymt-dcu-tunnel
    restart: unless-stopped
    network_mode: host
    mem_limit: 128m
    cpus: 0.25
    pids_limit: 64
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    environment:
      - FRP_SERVER_ADDR=${FRP_SERVER_ADDR:?FRP_SERVER_ADDR is required}
      - FRP_AUTH_TOKEN=${FRP_AUTH_TOKEN:?FRP_AUTH_TOKEN is required}
      - HYMT_STCP_KEY=${HYMT_STCP_KEY:?HYMT_STCP_KEY is required}
    volumes:
      - /usr/local/bin/frpc:/usr/local/bin/frpc:ro
      - ./hymt-frpc.toml:/etc/frp/hymt.toml:ro
    entrypoint: ["/usr/local/bin/frpc", "-c", "/etc/frp/hymt.toml"]
