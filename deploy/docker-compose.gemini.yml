# Gemini AI Studio text Q&A adapter.
# Enabled by deploy/cluster/deploy-252.sh when SUB2API_GEMINI=1.
services:
  sub2api:
    environment:
      - BUILTIN_ADAPTER_ENABLED=true
      - BUILTIN_ADAPTER_GEMINI_URL=http://sub2api-gemini:7877
      - BUILTIN_ADAPTER_GEMINI_KEY=${GEMINI_ADAPTER_KEY:?Set GEMINI_ADAPTER_KEY to a shared adapter key}
    depends_on:
      sub2api-gemini:
        condition: service_healthy

  sub2api-gemini:
    build:
      context: ./tools
      dockerfile: gemini2api/Dockerfile.sub2api
    image: ${GEMINI_IMAGE:-sub2api-gemini:local}
    restart: unless-stopped
    environment:
      TZ: ${TZ:-Asia/Shanghai}
      G2A_API_KEY: ${GEMINI_ADAPTER_KEY:?Set GEMINI_ADAPTER_KEY to a shared adapter key}
      GEMINI_API_KEY: ${GEMINI_API_KEY:?Set GEMINI_API_KEY to a Google AI Studio API key}
      G2A_MODELS: ${GEMINI_MODELS:?Set GEMINI_MODELS to enabled Gemini model IDs}
      G2A_LISTEN: 0.0.0.0:7877
      G2A_UPSTREAM_PROXY: ${G2A_UPSTREAM_PROXY:-http://sub2api-openai-egress:7890}
    networks:
      - sub2api-network
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 256m
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:7877/livez', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
