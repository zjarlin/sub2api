# =============================================================================
# 天津 GPU 机器：把重模型服务发布到内网，供 252 与 LAN 内其它服务调用。
# =============================================================================
# 叠加在 edge-media / gpt-sovits / edge-dub 各自 compose 之上，只追加端口映射。
# 只绑定天津内网地址（默认 0.0.0.0，可用 MEDIA_TIANJIN_BIND 收紧到 192.168.9.97），
# 公网访问仍然统一走 252 的 /media/* 入口，不在这里直接暴露。
# =============================================================================
services:
  gpt-sovits:
    ports:
      - "${MEDIA_TIANJIN_BIND:-0.0.0.0}:9880:9880"

  edge-dub:
    ports:
      - "${MEDIA_TIANJIN_BIND:-0.0.0.0}:18084:18084"

  edge-media:
    ports:
      - "${MEDIA_TIANJIN_BIND:-0.0.0.0}:18083:18083"
