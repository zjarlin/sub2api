services:
  hymt-visitor:
    image: ${HYMT_VISITOR_IMAGE:-sub2api-hymt-frpc:0.70.1}
    container_name: sub2api-hymt-visitor
    restart: unless-stopped
    mem_limit: 128m
    cpus: 0.25
    pids_limit: 64
    read_only: true
    user: "65534:65534"
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    extra_hosts:
      - host.docker.internal:host-gateway
    env_file:
      - ${HYMT_VISITOR_ENV_FILE:-/opt/sub2api/hymt-frp.env}
    command: ["-c", "/etc/frp/hymt-visitor.toml"]
    volumes:
      - ./hymt-frp-visitor.toml:/etc/frp/hymt-visitor.toml:ro
    networks:
      - sub2api-network

networks:
  sub2api-network:
    external: true
    name: ${HYMT_VISITOR_NETWORK:-sub2api_sub2api-network}
