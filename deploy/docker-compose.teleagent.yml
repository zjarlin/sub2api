# TeleAgent 的网页登录、请求签名和每日积分领取均在服务器执行。
services:
  sub2api:
    environment:
      - BUILTIN_ADAPTER_ENABLED=true
      - BUILTIN_ADAPTER_TELEAGENT_URL=http://sub2api-teleagent:7872
      - BUILTIN_ADAPTER_TELEAGENT_KEY=${TELEAGENT_ADAPTER_KEY:?Set TELEAGENT_ADAPTER_KEY to a shared adapter key}
    depends_on:
      sub2api-teleagent:
        condition: service_healthy

  sub2api-teleagent:
    build:
      context: ./tools/teleagent2api
      dockerfile: Dockerfile
    image: ${TELEAGENT_IMAGE:-sub2api-teleagent:local}
    restart: unless-stopped
    environment:
      TELEAGENT_ADAPTER_KEY: ${TELEAGENT_ADAPTER_KEY:?Set TELEAGENT_ADAPTER_KEY to a shared adapter key}
      TELEAGENT_DATA_DIR: /app/data
      TELEAGENT_REQUEST_TIMEOUT_MS: ${TELEAGENT_REQUEST_TIMEOUT_MS:-300000}
      TELEAGENT_MAX_CONCURRENT: ${TELEAGENT_MAX_CONCURRENT:-4}
      TELEAGENT_WELFARE_ENABLED: ${TELEAGENT_WELFARE_ENABLED:-1}
      TZ: Asia/Shanghai
    volumes:
      - "${TELEAGENT_STATE_DIR:-teleagent-data}:/app/data"
    networks: [sub2api-network]
    init: true
    read_only: true
    tmpfs:
      - /tmp:uid=1001,gid=1001,mode=0700,size=256m
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    shm_size: 256m
    pids_limit: 256
    mem_limit: 1g
    stop_grace_period: 30s
    healthcheck:
      test: [CMD, node, -e, "fetch('http://127.0.0.1:7872/livez').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3

volumes:
  teleagent-data:
