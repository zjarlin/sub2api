# 码道（华为云 CodeArts Ask 纯文本对话）内置适配器。
# 由 deploy/cluster/deploy-252.sh 在 SUB2API_MADAO=1 时通过 -f 叠加。
# 适配器进程含独立 Chromium（网页登录用），会话凭据保存在命名卷。
services:
  sub2api:
    environment:
      - BUILTIN_ADAPTER_ENABLED=true
      - BUILTIN_ADAPTER_MADAO_URL=http://sub2api-madao:7870
      - BUILTIN_ADAPTER_MADAO_KEY=${MADAO_ADAPTER_KEY:?Set MADAO_ADAPTER_KEY to a shared adapter key}
    depends_on:
      sub2api-madao:
        condition: service_healthy

  sub2api-madao:
    build:
      context: ./tools
      dockerfile: madao2api/Dockerfile.sub2api
    image: ${MADAO_IMAGE:-sub2api-madao:local}
    restart: unless-stopped
    environment:
      TZ: ${TZ:-Asia/Shanghai}
      MADAO_LISTEN: 0.0.0.0:7870
      MADAO_ADAPTER_KEY: ${MADAO_ADAPTER_KEY:?Set MADAO_ADAPTER_KEY to a shared adapter key}
      MADAO_STATE_FILE: /app/data/credential.json
      MADAO_BROWSER_EXECUTABLE: /usr/bin/chromium-browser
      MADAO_ASK_BASE_URL: ${MADAO_ASK_BASE_URL:-https://snap-access.cn-north-4.myhuaweicloud.com}
    volumes:
      - "${MADAO_STATE_DIR:-madao-data}:/app/data"
    networks:
      - sub2api-network
    security_opt: ["no-new-privileges:true"]
    cap_drop: [ALL]
    shm_size: 256m
    mem_limit: 768m
    healthcheck:
      test: [CMD, wget, -qO-, "http://127.0.0.1:7870/livez"]
      interval: 30s
      timeout: 5s
      retries: 3

volumes:
  madao-data:
