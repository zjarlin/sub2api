# =============================================================================
# Qoder 签名目录侧车（文件队列模式）
# =============================================================================
# Qoder 的 GET /algo/api/v2/model/list 只接受官方客户端签名（Authorization:
# Bearer COSY.* + Cosy-* 头 + /algo 前缀），签名逻辑编译在 WASM 里。主服务镜像
# 是 alpine、不带 Node，所以签名和请求放在独立 Node 容器里执行。
#
# 用法：
#   在基础 compose 之后追加本文件（deploy-252.sh 已自动追加）：
#     docker compose ... -f deploy/docker-compose.qoder-catalog.yml ...
#
# 通信方式：共享卷 + 文件队列。
#   主服务写 /var/lib/qoder-catalog/req.json，侧车 serve.mjs 写 resp.json。
#   不用 `docker exec -i ... node fetch.mjs` 的管道，因为 docker exec 的 stdout
#   在 64KB 处截断，而 chat 目录响应约 77KB，JSON 会被切成半截。走文件也不
#   需要把 docker.sock 暴露给主容器。
#
# 主服务侧环境变量（本文件已注入 sub2api）：
#   BUILTIN_ADAPTER_QODER_CATALOG_SCRIPT=/opt/qoder-catalog/fetch.mjs
#   BUILTIN_ADAPTER_QODER_CATALOG_WASM=/opt/qoder-catalog/wasm-lib.mjs
#   BUILTIN_ADAPTER_QODER_CATALOG_QUEUE_DIR=/var/lib/qoder-catalog
#   （不要设置 QODER_CATALOG_NODE=docker，那只用于 stdio 兼容路径）
# =============================================================================
services:
  sub2api:
    environment:
      - BUILTIN_ADAPTER_QODER_CATALOG_SCRIPT=/opt/qoder-catalog/fetch.mjs
      - BUILTIN_ADAPTER_QODER_CATALOG_WASM=/opt/qoder-catalog/wasm-lib.mjs
      - BUILTIN_ADAPTER_QODER_CATALOG_QUEUE_DIR=/var/lib/qoder-catalog
    volumes:
      # 只读挂载脚本与 33MB WASM，不进入主镜像层。
      - ./tools/qoder-catalog:/opt/qoder-catalog:ro
      - qoder_catalog_queue:/var/lib/qoder-catalog

  qoder-catalog:
    image: ${QODER_CATALOG_NODE_IMAGE:-node:22-bookworm-slim}
    container_name: sub2api-qoder-catalog
    restart: unless-stopped
    command: ["node", "/opt/qoder-catalog/serve.mjs", "/var/lib/qoder-catalog"]
    working_dir: /opt/qoder-catalog
    volumes:
      - ./tools/qoder-catalog:/opt/qoder-catalog:ro
      - qoder_catalog_queue:/var/lib/qoder-catalog
    environment:
      - NODE_NO_WARNINGS=1
    networks:
      - sub2api-network
    mem_limit: 256m
    healthcheck:
      test: ["CMD", "node", "--version"]
      interval: 60s
      timeout: 5s
      retries: 3
      start_period: 5s

volumes:
  qoder_catalog_queue:
