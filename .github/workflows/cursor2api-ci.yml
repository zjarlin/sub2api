name: Cursor Adapter

on:
  push:
    paths:
      - 'tools/cursor2api/**'
      - 'deploy/docker-compose.cursor.yml'
      - 'deploy/cluster/deploy-252.sh'
      - 'deploy/tests/cursor-deploy-test.sh'
      - '.github/workflows/cursor2api-ci.yml'
  pull_request:
    paths:
      - 'tools/cursor2api/**'
      - 'deploy/docker-compose.cursor.yml'
      - 'deploy/cluster/deploy-252.sh'
      - 'deploy/tests/cursor-deploy-test.sh'
      - '.github/workflows/cursor2api-ci.yml'

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: tools/cursor2api/package-lock.json
      - name: Install Cursor SDK
        working-directory: tools/cursor2api
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Adapter tests
        working-directory: tools/cursor2api
        run: npm test
      - name: Deployment tests
        run: |
          bash -n deploy/cluster/deploy-252.sh deploy/tests/cursor-deploy-test.sh
          bash deploy/tests/cursor-deploy-test.sh
